<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Artes generados</title>
<style>
  :root{ --bg:#F5F1E6; --panel:#fff; --line:#e4e0d5; --ink:#1d1b18; --muted:#6f6a63; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}

  /* Login */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 28px; width:100%; max-width:360px; box-shadow:0 18px 50px rgba(0,0,0,.10);}
  .card h1{font-size:19px; margin:0 0 4px;}
  .card p{font-size:13px; color:var(--muted); margin:0 0 22px;}
  label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:0 0 7px; font-weight:600;}
  input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; background:#fbfaf8; outline:none; margin-bottom:16px;}
  input:focus{border-color:var(--ink);}
  button.primary{width:100%; padding:13px; border:none; border-radius:10px; background:var(--ink); color:#fff; font-size:14px; font-weight:600; cursor:pointer;}
  button.primary:hover{opacity:.92;}
  button.primary:disabled{opacity:.5; cursor:default;}
  .err{color:#b3261e; font-size:12.5px; margin:0 0 14px; min-height:16px;}

  /* App */
  .topbar{position:sticky; top:0; z-index:5; background:rgba(245,241,230,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:16px 22px; display:flex; align-items:center; justify-content:space-between;}
  .topbar h2{font-size:16px; margin:0;}
  .topbar .count{font-size:12.5px; color:var(--muted); margin-left:10px;}
  .topbar button{padding:8px 14px; border:1px solid var(--line); background:#fff; border-radius:9px; font-size:12.5px; cursor:pointer;}
  .topbar button:hover{border-color:var(--ink);}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; padding:22px;}
  .item{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column;}
  .item img{width:100%; display:block; background:#eee; aspect-ratio:4/5; object-fit:contain; border-bottom:1px solid var(--line);}
  .meta{padding:11px 12px; font-size:12px; line-height:1.5;}
  .meta .nuevo{font-weight:700; word-break:break-word;}
  .meta .antes{color:var(--muted); text-decoration:line-through;}
  .meta .row2{display:flex; justify-content:space-between; align-items:center; margin-top:6px; color:var(--muted); font-size:11px;}
  .meta a{color:var(--ink); font-weight:600; text-decoration:none; font-size:11.5px;}
  .meta a:hover{text-decoration:underline;}
  .empty, .loading{text-align:center; color:var(--muted); padding:80px 20px; font-size:14px;}
  .tag{display:inline-block; padding:2px 7px; border:1px solid var(--line); border-radius:6px; font-size:10px; text-transform:uppercase; letter-spacing:.4px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login">
  <div class="card">
    <h1>Panel de admin</h1>
    <p>Artes generados en la campaña. Ingresa con tu cuenta de administrador.</p>
    <p class="err" id="err"></p>
    <label>Correo</label>
    <input type="email" id="email" placeholder="tucorreo@ejemplo.com" autocomplete="username">
    <label>Contraseña</label>
    <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
    <button class="primary" id="loginBtn">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="topbar">
    <div><h2 style="display:inline">Artes generados</h2><span class="count" id="count"></span></div>
    <button id="logout">Cerrar sesión</button>
  </div>
  <div id="content"><div class="loading">Cargando…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = "https://ihpxtvfhtjquvyonahhv.supabase.co";
const SUPA_KEY = "sb_publishable_l-7H9HDSpxrs2GU3DXKHiA_yRMQ3yUA";
const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const $ = id => document.getElementById(id);

async function doLogin(){
  $('err').textContent='';
  $('loginBtn').disabled=true; $('loginBtn').textContent='Entrando…';
  const { error } = await supa.auth.signInWithPassword({ email:$('email').value.trim(), password:$('pass').value });
  $('loginBtn').disabled=false; $('loginBtn').textContent='Entrar';
  if(error){ $('err').textContent = 'No se pudo entrar: ' + error.message; return; }
  showApp();
}
$('loginBtn').onclick = doLogin;
$('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

$('logout').onclick = async ()=>{ await supa.auth.signOut(); location.reload(); };

async function showApp(){
  $('login').style.display='none';
  $('app').style.display='block';
  await loadGallery();
}

function fmtDate(s){
  try{ return new Date(s).toLocaleString('es-EC', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return s; }
}

async function loadGallery(){
  const { data, error } = await supa.from('generados').select('*').order('created_at',{ascending:false});
  if(error){ $('content').innerHTML = '<div class="empty">Error al cargar: '+error.message+'</div>'; return; }
  if(!data || !data.length){ $('content').innerHTML = '<div class="empty">Aún no se ha generado ningún arte.</div>'; $('count').textContent=''; return; }
  $('count').textContent = '· ' + data.length + ' en total';

  // URLs firmadas (privadas) en lote
  const paths = data.map(d=>d.image_path).filter(Boolean);
  let signed = {};
  if(paths.length){
    const { data:urls } = await supa.storage.from('artes').createSignedUrls(paths, 3600);
    (urls||[]).forEach(u=>{ if(u.path && u.signedUrl) signed[u.path]=u.signedUrl; });
  }

  const grid = document.createElement('div');
  grid.className='grid';
  data.forEach(d=>{
    const url = signed[d.image_path] || '';
    const el = document.createElement('div');
    el.className='item';
    el.innerHTML =
      (url ? '<img loading="lazy" src="'+url+'">' : '<div style="aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px">sin imagen</div>') +
      '<div class="meta">'+
        '<div class="nuevo">'+escapeHtml(d.nombre_nuevo||'')+'</div>'+
        (d.marca_anterior ? '<div class="antes">'+escapeHtml(d.marca_anterior)+'</div>' : '')+
        '<div class="row2">'+
          '<span class="tag">'+(d.formato||'').split('-')[0]+'</span>'+
          (url ? '<a href="'+url+'" download>Descargar</a>' : '')+
        '</div>'+
        '<div class="row2"><span>'+fmtDate(d.created_at)+'</span></div>'+
      '</div>';
    grid.appendChild(el);
  });
  $('content').innerHTML='';
  $('content').appendChild(grid);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ¿Sesión ya activa? (recuerda el login)
(async ()=>{
  const { data } = await supa.auth.getSession();
  if(data && data.session) showApp();
})();
</script>
</body>
</html>
