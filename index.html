<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Arte Tipográfico</title>
<style>
  :root{ --panel:#ffffff; --bg:#eceae6; --line:#dcd8d1; --ink:#1d1b18; --muted:#6f6a63; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}
  .wrap{display:flex; min-height:100vh;}
  .panel{width:360px; flex:0 0 360px; background:var(--panel); border-right:1px solid var(--line); padding:26px 24px 40px; overflow-y:auto; height:100vh;}
  .stage{flex:1; display:flex; align-items:center; justify-content:center; padding:32px;}
  h1{font-size:17px; margin:0 0 2px; letter-spacing:.2px;}
  .sub{font-size:12px; color:var(--muted); margin:0 0 24px;}
  .group{margin-bottom:22px;}
  label.lbl{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:var(--muted); margin-bottom:9px; font-weight:600;}
  input[type=text], textarea{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; color:var(--ink); background:#fbfaf8; outline:none;}
  textarea{min-height:82px; resize:vertical;}
  input[type=text]:focus, textarea:focus{border-color:var(--ink);}
  .segmented{display:flex; gap:8px;}
  .seg{flex:1; text-align:center; padding:10px 6px; border:1px solid var(--line); border-radius:9px; background:#fbfaf8; cursor:pointer; font-size:12.5px; user-select:none; transition:.12s;}
  .seg small{display:block; color:var(--muted); font-size:10.5px; margin-top:2px;}
  .seg.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .seg.active small{color:#d8d4cd;}
  input[type=range]{width:100%; accent-color:var(--ink);}
  .sizeval{font-size:11.5px; color:var(--muted); float:right; font-weight:600;}
  .download{width:100%; padding:14px; border:none; border-radius:11px; background:var(--ink); color:#fff; font-size:14.5px; font-weight:600; cursor:pointer; letter-spacing:.3px; margin-top:6px;}
  .download:hover{opacity:.92;}
  .hint{font-size:11px; color:var(--muted); margin-top:12px; line-height:1.5;}
  .preview-shell{box-shadow:0 18px 50px rgba(0,0,0,.18); border-radius:4px; overflow:hidden; background:#fff; max-height:calc(100vh - 64px); display:flex;}
  canvas{display:block; max-height:calc(100vh - 64px); max-width:calc(100vw - 440px); width:auto; height:auto;}
  @media (max-width:820px){
    .wrap{flex-direction:column;}
    .panel{width:100%; flex:none; height:auto; border-right:none; border-bottom:1px solid var(--line);}
    canvas{max-width:calc(100vw - 40px); max-height:70vh;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Generador de arte tipográfico</h1>
    <p class="sub">Los textos de arriba y abajo son fijos. Tú llenas la marca y el texto central.</p>

    <div class="group">
      <label class="lbl">Formato</label>
      <div class="segmented" id="formats">
        <div class="seg active" data-w="1080" data-h="1350">Post<small>1080 × 1350</small></div>
        <div class="seg" data-w="1080" data-h="1920">Historia<small>1080 × 1920</small></div>
      </div>
    </div>

    <div class="group">
      <label class="lbl">Marca original (saldrá tachada)</label>
      <input type="text" id="marca" value="Banco Guayaquil" placeholder="Ej: Banco Guayaquil">
    </div>

    <div class="group">
      <label class="lbl">Texto central (con “@”)</label>
      <textarea id="text" placeholder="Ej: elbanco magenta">elbanco magenta</textarea>
    </div>

    <div class="group">
      <label class="lbl">Tamaño del texto central <span class="sizeval" id="sizeval">160</span></label>
      <input type="range" id="size" min="60" max="360" value="160">
    </div>

    <button class="download" id="dl">Descargar JPG</button>
    <p class="hint">El texto central siempre va centrado, en mayúsculas y empieza con “@”. La marca original aparece tachada en la línea de arriba.</p>
  </div>

  <div class="stage">
    <div class="preview-shell">
      <canvas id="cv" width="1080" height="1350"></canvas>
    </div>
  </div>
</div>

const BG = "#F5F1E6";
const INK = "#141414";
const HEADER_LINE2 = "TAMBIÉN ME CONOCES COMO";
const FOOTER = [
  {t:"PORQUE COMO DICE", bold:false},
  {t:"@ELRESTAURANTEDEMOROSYCARNES", bold:true},
  {t:"LO QUE SE HACE CON AMOR", bold:false},
  {t:"NO NECESITA NOMBRE.", bold:false}
];

const state = { w:1080, h:1350, marca:"Banco Guayaquil", text:"elbanco magenta", size:160 };

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const fmts=document.getElementById('formats');
fmts.querySelectorAll('.seg').forEach(s=>{
  s.onclick=()=>{ fmts.querySelectorAll('.seg').forEach(x=>x.classList.remove('active')); s.classList.add('active'); state.w=+s.dataset.w; state.h=+s.dataset.h; render(); };
});
document.getElementById('marca').oninput=e=>{ state.marca=e.target.value; render(); };
document.getElementById('text').oninput=e=>{ state.text=e.target.value; render(); };
document.getElementById('size').oninput=e=>{ state.size=+e.target.value; document.getElementById('sizeval').textContent=e.target.value; render(); };

function prepared(){
  let t = state.text.replace(/\s+/g,' ').trim().toUpperCase();
  t = t.replace(/^@+/, '');
  return '@' + t;
}

// RNG con semilla (para que el rayón sea estable por marca, pero varíe entre marcas)
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function seeded(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// rayón de marcador: varios trazos gruesos encimados, con ondulación
function scribble(x0, x1, yc, h){
  const rnd = seeded(hashStr((state.marca||'x')+'|'+((x1-x0)|0)));
  ctx.strokeStyle = INK;
  ctx.lineCap='round'; ctx.lineJoin='round';
  const strokes = 4;
  for(let s=0; s<strokes; s++){
    ctx.lineWidth = h*(0.14 + rnd()*0.07);
    ctx.globalAlpha = 0.82 + rnd()*0.18;
    const yoff  = (s-(strokes-1)/2)*h*0.085 + (rnd()-0.5)*h*0.05;
    const tilt  = (rnd()-0.5)*h*0.20;
    const sx = x0 - h*0.14 - rnd()*h*0.12;
    const ex = x1 + h*0.14 + rnd()*h*0.12;
    const segs = 7;
    ctx.beginPath();
    for(let i=0;i<=segs;i++){
      const t=i/segs;
      const px = sx + (ex-sx)*t;
      const py = yc + yoff + tilt*(t-0.5) + Math.sin(t*Math.PI*2 + s)*h*0.045 + (rnd()-0.5)*h*0.04;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function wrapLines(str, maxW){
  const words = str.split(' ');
  const lines = []; let line = '';
  const pushWord = (w)=>{
    if(ctx.measureText(w).width <= maxW){
      const test = line ? line+' '+w : w;
      if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
      else line = test;
    } else {
      if(line){ lines.push(line); line=''; }
      let chunk='';
      for(const ch of w){
        const test = chunk+ch;
        if(ctx.measureText(test).width > maxW && chunk){ lines.push(chunk); chunk=ch; }
        else chunk=test;
      }
      line = chunk;
    }
  };
  words.forEach(pushWord);
  if(line) lines.push(line);
  return lines;
}

// devuelve el tamaño de fuente que hace caber `text` en maxW (a lo más base)
function fitFont(text, base, maxW){
  let s = base;
  ctx.font = s+'px "Boyrun"';
  while(ctx.measureText(text).width > maxW && s > 14){ s--; ctx.font = s+'px "Boyrun"'; }
  return s;
}

async function render(){
  cv.width=state.w; cv.height=state.h;
  ctx.fillStyle=BG; ctx.fillRect(0,0,state.w,state.h);
  try{ await document.fonts.load('160px "Boyrun"'); }catch(e){}
  ctx.fillStyle=INK;
  ctx.textBaseline='alphabetic';
  const cx=state.w/2;
  const margin=Math.round(state.w*0.06);
  const maxW=state.w-margin*2;

  // ---------- ENCABEZADO ----------
  const marca=(state.marca||'').replace(/\s+/g,' ').trim().toUpperCase();
  const s1='SOY ', s3=', PERO';
  const fullTop = s1+marca+s3;
  let hf = fitFont(fullTop, 34, maxW);
  ctx.font = hf+'px "Boyrun"';
  const topW = ctx.measureText(fullTop).width;
  const y1 = Math.round(state.h*0.235);
  const left = cx - topW/2;
  ctx.textAlign='left';
  ctx.fillText(fullTop, left, y1);
  // rayón sobre la marca (marcador grueso, varios trazos)
  if(marca){
    const x0 = left + ctx.measureText(s1).width;
    const x1 = x0 + ctx.measureText(marca).width;
    const sy = y1 - hf*0.32;
    scribble(x0, x1, sy, hf);
  }
  // línea 2 del encabezado
  const hf2 = fitFont(HEADER_LINE2, 34, maxW);
  ctx.font = hf2+'px "Boyrun"';
  ctx.textAlign='center';
  ctx.fillText(HEADER_LINE2, cx, y1 + hf*0.30 + hf2);

  // ---------- TEXTO CENTRAL ----------
  ctx.font = state.size+'px "Boyrun"';
  ctx.textAlign='center';
  const lines = wrapLines(prepared(), maxW);
  const lineH = state.size*0.96;
  const totalH = (lines.length-1)*lineH + state.size;
  let cy = state.h*0.50 - totalH/2 + state.size*0.80;
  lines.forEach(line=>{ ctx.fillText(line, cx, cy); cy += lineH; });

  // ---------- PIE ----------
  const otherLines = FOOTER.filter(o=>!o.bold).map(o=>o.t);
  const ffOther = Math.min(...otherLines.map(t=>fitFont(t, 32, maxW)));
  const handleObj = FOOTER.find(o=>o.bold);
  const handleMaxW = state.w*0.93;                                   // el @ puede usar casi todo el ancho
  const ffHandle = fitFont(handleObj.t, Math.round(ffOther*1.30), handleMaxW); // ~30% más grande
  const extra = (ffHandle-ffOther)*0.5;                             // aire simétrico arriba/abajo del @
  let fy = state.h*0.705;
  ctx.strokeStyle = INK; ctx.lineJoin='round'; ctx.textAlign='center';
  FOOTER.forEach(o=>{
    const size = o.bold ? ffHandle : ffOther;
    if(o.bold) fy += extra;                                         // aire antes del @
    ctx.font = size+'px "Boyrun"';
    ctx.fillText(o.t, cx, fy);
    if(o.bold){ ctx.lineWidth = size*0.038; ctx.strokeText(o.t, cx, fy); } // refuerzo ligero = @ limpio
    fy += ffOther*1.18 + (o.bold ? extra : 0);                      // mismo interlineado base + aire igual al de arriba
  });
}

document.getElementById('dl').onclick=async ()=>{
  await render();
  const name=(state.h===1920?'arte-historia-1080x1920':'arte-post-1080x1350')+'.jpg';
  const a=document.createElement('a'); a.href=cv.toDataURL('image/jpeg',0.95); a.download=name; a.click();
};
